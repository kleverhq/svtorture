# Copy this directory to cases/<id>/ and replace every angle-bracket value.
schema_version = 1
id = "<case-id>"
title = "<short title>"
description = "<one semantic boundary>"
primary_requirement = "SV-2023-<CH>-<REQUIREMENT>"
related_requirements = []
standard_revision = "1800-2023"
revision_applicability = { "1800-2012" = "not-assessed", "1800-2017" = "not-assessed", "1800-2023" = "applicable" }
target_phase = "simulate"
expectation = "accept"
evidence = "mandatory"
sources = ["top.sv"]
top = "top"
defines = []
include_dirs = []
runtime_args = []
tags = ["<semantic-tag>"]
limits = { timeout_seconds = 30, output_bytes = 65536, memory_mb = 2048, pids = 256 }
oracle = { kind = "runtime-pass-marker", marker = "SVTORTURE_PASS:<case-id>" }
provenance = { origin = "original", license = "Apache-2.0", notes = "<authority and design note>" }
