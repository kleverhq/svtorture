name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Run the local CI contract
        run: just ci
      - name: Retain campaigns and full stage logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-evidence-${{ github.run_id }}
          path: |
            .svtorture/campaigns/**/campaign.json
            .svtorture/work/**/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  annotation-index:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ieee-1800-2023-annotation
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.21.0"
      - name: Detect licensed PDF URL
        id: pdf
        env:
          PDF_URL: ${{ secrets.IEEE_1800_2023_PDF_URL }}
        run: |
          if test -n "$PDF_URL"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report skipped anchor verification
        if: steps.pdf.outputs.available != 'true'
        run: echo "::warning title=IEEE 1800-2023 annotation::IEEE_1800_2023_PDF_URL is not configured; committed anchor regeneration was not verified."
      - name: Install Poppler
        if: steps.pdf.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Download licensed PDF
        if: steps.pdf.outputs.available == 'true'
        env:
          PDF_URL: ${{ secrets.IEEE_1800_2023_PDF_URL }}
        run: |
          mkdir -p .svtorture/annotation-ci
          curl --fail --location --silent --show-error \
            "$PDF_URL" \
            --output .svtorture/annotation-ci/IEEE-1800-2023.pdf
      - name: Verify committed anchors
        if: steps.pdf.outputs.available == 'true'
        run: just annotate-check .svtorture/annotation-ci/IEEE-1800-2023.pdf
