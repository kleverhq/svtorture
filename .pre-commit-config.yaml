repos:
  - repo: local
    hooks:
      - id: svtorture-annotated-anchors
        name: SVTORTURE annotated anchor index
        entry: python3 scripts/check_annotated_anchors.py
        language: system
        pass_filenames: false
        always_run: true
      - id: svtorture-python
        name: SVTORTURE Python format/lint/type
        entry: just hook-python
        language: system
        pass_filenames: false
        always_run: true
      - id: svtorture-metadata
        name: SVTORTURE strict metadata/schema
        entry: just hook-metadata
        language: system
        pass_filenames: false
        files: ^(cases/|standards/|suites/|tools/|schemas/|src/svtorture/(catalog|models)\.py$)
      - id: svtorture-focused-tests
        name: SVTORTURE focused unit tests
        entry: just hook-tests
        language: system
        pass_filenames: false
        files: ^(src|tests|cases|standards|suites|tools)/
      - id: svtorture-dashboard
        name: SVTORTURE dashboard type/tests
        entry: just hook-frontend
        language: system
        pass_filenames: false
        files: ^dashboard/
