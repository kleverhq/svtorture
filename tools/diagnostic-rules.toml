schema_version = 1

# These are adapter-maintained fallbacks used only when a tool omits source
# locations. Location-bearing diagnostics always take precedence.
[[rules]]
tool = "vcs"
case = "ch05-base-format-whitespace-rejected"
contains = "syntax error"
severity = "error"

[[rules]]
tool = "vcs"
case = "ch23-mixed-port-style-rejected"
contains = "port connection"
severity = "error"
