    "[2023:19.5.3:P001:p594]",
    "[2023:19.5:P015:p584]",
]
summary = "An integral-expression coverpoint with no user-defined bins other than ignore_bins or illegal_bins receives automatically created state bins; real-expression coverpoints never receive automatic bins."
related_clauses = [
    "19.5.5",
    "19.5.6",
]
tags = []

[requirements.revision_applicability.1800-2012]
status = "changed-expectation"
clause = "19.5.3"
note = "The 2012 rule creates automatic state bins only when a coverage point defines no bins; it does not extend that trigger to points containing only ignore_bins or illegal_bins, nor state the 2023 real-expression explicit-bin guarantee."

[requirements.revision_applicability.1800-2017]
status = "changed-expectation"
clause = "19.5.3"
note = "The 2017 rule creates automatic state bins only when no bins are defined at all, rather than also when the only definitions are ignore_bins or illegal_bins; 2017 also restricts coverpoints to integral expressions and therefore has no corresponding real-expression coverpoint rule."

[requirements.revision_applicability.1800-2023]
status = "applicable"
clause = "19.5.3"

