    "[2023:H.9.5:L002:p1274]",
    "[2023:H.9.5:L003:p1274]",
    "[2023:H.9.5:P004:p1274]",
]
summary = "The model-independent VPI routines vpi_printf, vpi_vprintf, vpi_flush, vpi_mcd_open, vpi_mcd_close, vpi_mcd_name, vpi_mcd_printf, vpi_mcd_vprintf, vpi_mcd_flush, and vpi_get_vlog_info shall be callable from a DPI import without declaring it context or adding context instrumentation."
