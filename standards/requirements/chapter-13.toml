anchors = [
    "[2023:13.4.3:L006:p345]",
    "[2023:13.4.3:P001:p345]",
]
summary = "A constant function may invoke only constant functions, except that it may call any built-in method on its local variables, including implicit variables, even when that method is not otherwise a constant built-in method."
related_clauses = [
    "11.2.1",
    "13.4.1",
]
tags = ["constant-expression", "function"]

[requirements.revision_applicability.1800-2012]
status = "changed-expectation"
clause = "13.4.3"
note = "The 2012 rule requires an invoked constant function to be local to the current module and separately permits only system functions allowed in constant expressions; it lacks the 2023 exception for all built-in methods on function-local variables."

[requirements.revision_applicability.1800-2017]
status = "changed-expectation"
clause = "13.4.3"
note = "The 2017 rule requires an invoked function to be a constant function local to the current module and separately permits only system functions allowed in constant expressions; it lacks the 2023 exception permitting all built-in methods on local variables."

[requirements.revision_applicability.1800-2023]
status = "applicable"
