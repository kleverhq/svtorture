[[requirements]]
id = "SV-2023-13-CONSTANT-FUNCTION-CALL-DEFINITION"
standard_revision = "1800-2023"
part = "13"
clause = "13.4.3"
anchors = [
    "[2023:13.4.3:P002:p345]",
]
summary = "A constant function call is evaluated at elaboration when all arguments are constant expressions and its constant-function declaration—or a static class function declaration—is local to the calling design element or in a package or $unit; parameterized static class functions are included."
related_clauses = [
    "8.10",
    "13.8",
]
tags = ["class-method", "constant-expression", "elaboration", "function"]

[requirements.revision_applicability.1800-2012]
status = "changed-expectation"
clause = "13.4.3"
note = "The 2012 rule limits a constant function call to a constant function local to the calling module or from a package or $unit; it does not include the 2023 static-class-function and calling-design-element formulation."

[requirements.revision_applicability.1800-2017]
status = "changed-expectation"
clause = "13.4.3"
note = "The 2017 rule limits a constant function call to a constant function local to the calling module or from a package or $unit; it does not include the 2023 rule for static class functions, including parameterized static class functions, local to a calling design element."

[requirements.revision_applicability.1800-2023]
status = "applicable"
clause = "13.4.3"

[[requirements]]
id = "SV-2023-13-CONSTANT-FUNCTION-CALLS"
