note = "IEEE 1800-2012 permits termination of an unblocked target at an unspecified time in the current time step and does not guarantee that all affected processes have terminated before kill() returns."

[requirements.revision_applicability.1800-2017]
status = "changed-expectation"
clause = "9.7"
note = "The 2017 kill() rule permits an unblocked target to terminate at an unspecified time in the current time step, rather than requiring every affected process to terminate before kill() returns."

