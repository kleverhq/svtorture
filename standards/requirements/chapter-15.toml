[[requirements]]
id = "SV-2023-15-TRIGGERED-REEVALUATION"
standard_revision = "1800-2023"
part = "15"
clause = "15.5.3"
anchors = [
    "[2023:15.5.3:P009:p379]",
]
summary = "An event expression or wait condition is reevaluated only when an expression operand changes; triggered() reverting from true to false at the end of a time step does not itself cause reevaluation of a control waiting on it."
related_clauses = []
tags = ["event", "scheduling", "simulation-time", "timing-control"]

[requirements.revision_applicability.1800-2012]
status = "not-applicable"
note = "IEEE 1800-2012 does not specify that end-of-step clearing of the triggered property leaves event expressions and wait conditions unevaluated."

