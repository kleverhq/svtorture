part = "15"
clause = "15.3.3"
anchors = [
    "[2023:15.3.3:P005:p373]",
]
summary = "A semaphore preserves the arrival order of processes in its waiting queue (FIFO), without defining the order in which concurrent processes arrive at that queue."
related_clauses = []
tags = ["queue", "scheduling", "semaphore"]

