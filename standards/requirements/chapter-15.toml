[[requirements]]
id = "SV-2023-15-WAIT-ORDER-SYNTAX-SEMANTICS"
standard_revision = "1800-2023"
part = "15"
clause = "15.5.4"
anchors = [
    "[2023:15.5.4:P001:p379]",
    "[2023:15.5.4:G001:p379-380]",
]
summary = "wait_order accepts one or more named-event identifiers followed by an action block; it suspends until they trigger left-to-right and then executes the success statement, but fails if an as-yet-untriggered later event triggers out of order."
related_clauses = []
tags = ["event", "lexical", "scheduling", "timing-control"]

