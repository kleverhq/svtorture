[[requirements]]
id = "SV-2023-15-WAIT-ORDER-FAILURE-ACTION"
standard_revision = "1800-2023"
part = "15"
clause = "15.5.4"
anchors = [
    "[2023:15.5.4:P005:p380]",
]
summary = "When wait_order fails, it executes the else statement if supplied; without an else clause, failure generates a run-time error by calling $error."
related_clauses = [
    "20.10",
]
tags = ["action-block", "diagnostic", "event", "timing-control"]

[requirements.revision_applicability.1800-2012]
status = "changed-expectation"
clause = "15.5.4"
note = "IEEE 1800-2012 requires the supplied fail statement or, when absent, a run-time error, but does not specify that the default error is generated by calling $error."

[requirements.revision_applicability.1800-2017]
status = "changed-expectation"
clause = "15.5.4"
note = "IEEE 1800-2017 requires a run-time error when no fail statement is supplied but does not specify that the error is generated by calling $error."

[requirements.revision_applicability.1800-2023]
status = "applicable"
clause = "15.5.4"

