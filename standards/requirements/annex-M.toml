anchors = [
    "[2023:M.2:C001:p1326-1330]",
]
summary = "The normative sv_vpi_user.h header shall define every listed SystemVerilog VPI object, variable, typespec, assertion, statement, net, constraint, and related object-type identifier with its specified integer value or vpi_user.h alias."
related_clauses = [
    "37.3",
]
tags = ["constant", "pli"]

[requirements.revision_applicability.1800-2012]
status = "changed-expectation"
clause = "M.2"
note = "The 2012 header lacks several object/type identifiers and aliases listed in 2023, including vpiInterfaceTypespec, the added net/nettype identifiers, vpiNetTypedefAlias, and singular vpiConcurrentAssertion."

[requirements.revision_applicability.1800-2017]
status = "changed-expectation"
clause = "M.2"
note = "The 2017 header omits the 2023 net object identifiers vpiNettypeDecl, vpiUnionNet through vpiInterconnectArray, and vpiNetTypedefAlias; it also defines vpiConcurrentAssertions directly as 740 rather than via the new singular vpiConcurrentAssertion alias."

