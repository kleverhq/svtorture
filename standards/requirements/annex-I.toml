[[requirements]]
id = "SV-2023-I-DPI-ACTIVE-SCOPE"
standard_revision = "1800-2023"
part = "I"
clause = "I.3"
anchors = [
    "[2023:I.3:C007:p1297-1298]",
]
summary = "Within a DPI context call chain, svGetScope shall return the active scope (the import declaration scope unless changed by svSetScope); svSetScope with a legal scope shall establish that scope for subsequent exported calls and return the previous active scope, while an exported call made during an import inherits that import's scope by default."
related_clauses = [
    "35.5.3",
    "H.9.2",
    "H.9.3",
]
tags = []

