[[requirements]]
id = "SV-2023-I-TIME-REPRESENTATION"
standard_revision = "1800-2023"
part = "I"
clause = "I.3"
anchors = [
    "[2023:I.3:C003:p1293-1294]",
]
summary = "Unless compatible VPI time definitions are already present under VPI_TIME, svdpi.h shall define s_vpi_time with int32_t type, uint32_t high and low, and double real fields and define vpiScaledRealTime=1, vpiSimTime=2, and vpiSuppressTime=3; it shall expose svTimeVal as s_vpi_time and alias sv_scaled_real_time and sv_sim_time to the first two VPI kinds."
related_clauses = [
    "H.13",
]
tags = []

