[[requirements]]
id = "SV-2023-I-DPI-SCALED-TIME-QUERY"
standard_revision = "1800-2023"
part = "I"
clause = "I.3"
anchors = [
    "[2023:I.3:C007:p1297-1298]",
]
summary = "svGetTime shall write the current simulation time scaled to the specified valid scope's time unit, or to the simulation time unit when scope is NULL, returning 0 on success and -1 for an error, including an invalid scope."
related_clauses = [
    "H.13",
]
tags = []

