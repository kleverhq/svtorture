status = "applicable"
clause = "L.2"

[requirements.revision_applicability.1800-2017]
status = "applicable"
clause = "L.2"

[requirements.revision_applicability.1800-2023]
status = "applicable"
clause = "L.2"

[[requirements]]
id = "SV-2023-L-NEWER-COMPATIBILITY-VERSIONS-NORMALIZE-TO-2012"
standard_revision = "1800-2023"
part = "L"
clause = "L.2"
anchors = [
    "[2023:L.2:C001:p1323-1325]",
]
summary = "If VPI_COMPATIBILITY_VERSION_1800v2017 or VPI_COMPATIBILITY_VERSION_1800v2023 is selected with value 1 before vpi_compatibility.h is processed, the header shall define VPI_COMPATIBILITY_VERSION_1800v2012."
related_clauses = [
    "36.12.2.1",
]
tags = []

[requirements.revision_applicability.1800-2012]
status = "not-applicable"
note = "IEEE 1800-2012 has no 1800v2017 or 1800v2023 compatibility selectors and therefore no rule normalizing either selector to 1800v2012."

[requirements.revision_applicability.1800-2017]
status = "changed-expectation"
clause = "L.2"
note = "The 2017 header normalizes only VPI_COMPATIBILITY_VERSION_1800v2017 to the 1800v2012 selector; the 1800v2023 selector and its additional normalization were not present."

[requirements.revision_applicability.1800-2023]
status = "applicable"
clause = "L.2"
