    "[2023:N.2:C004:p1342-1344]",
    "[2023:N.1:TN.1.R04:p1337]",
]
summary = "With mean greater than 0, $dist_poisson starts a count at zero, compares exp(-mean) with a uniform variate, and while the threshold is smaller increments the count and multiplies the accumulated variate by another uniform variate; it returns the final count and advances the seed once per variate."
related_clauses = [
    "20.14.2",
]
