    "[2023:N.1:TN.1.R03:p1337]",
]
summary = "With mean greater than 0, $dist_exponential obtains one unit-interval uniform variate U, advances the seed once, computes -log(U)*mean, and rounds the result to nearest integer with ties away from zero."
