    "[2023:N.2:C002:p1339-1341]",
    "[2023:N.2:C004:p1342-1344]",
    "[2023:N.1:TN.1.R02:p1337]",
]
summary = "$dist_normal repeatedly obtains pairs of uniform variates mapped to (-1,1) until their squared radius is nonzero and less than 1, transforms the first component by sqrt(-2*log(radius)/radius), scales by standard_deviation, adds mean, advances the seed for every attempted pair, and rounds to nearest integer with ties away from zero."
