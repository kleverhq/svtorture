]
summary = "When $dist_uniform has LONG_MIN < start < end and end equals LONG_MAX, it decrements start for the helper call, adds 1 to the sample, converts nonnegative samples by truncation and negative samples from r-1, clamps to the original inclusive endpoints, and returns that result with the helper-updated seed."
