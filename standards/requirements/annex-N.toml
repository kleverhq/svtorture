    "[2023:N.1:TN.1.R07:p1337]",
]
summary = "With k_stage greater than 0, $dist_erlang multiplies k_stage successive unit-interval uniform variates, computes -mean*log(product)/k_stage, advances the seed once per variate, and rounds the result to nearest integer with ties away from zero."
