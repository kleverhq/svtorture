summary = "With degree_of_freedom greater than 0, $dist_t computes a chi-square variate of that degree followed by a standard-normal variate, divides the normal variate by sqrt(chi-square/degree_of_freedom), advances the seed through both helpers, and rounds the result to nearest integer with ties away from zero."
