summary = "When start is less than end and end is less than LONG_MAX, $dist_uniform increments end for the helper call, applies the Annex N seed step and IEEE-float affine conversion, converts nonnegative samples by truncation and negative samples from r-1, clamps at the original endpoints, and returns a value in the inclusive original interval."
