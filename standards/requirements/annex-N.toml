    "[2023:N.2:C003:p1341-1342]",
    "[2023:N.1:TN.1.R01:p1337]",
]
summary = "Whenever a probabilistic distribution call reaches the Annex N uniform helper with seed 0, the helper substitutes 259341593 before applying the 69069*seed+1 update, so the sample and updated seed match a helper invocation initialized to 259341593."
