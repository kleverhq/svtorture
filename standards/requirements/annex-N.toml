[[requirements]]
id = "SV-2023-N-CHI-SQUARE-ALGORITHM"
standard_revision = "1800-2023"
part = "N"
clause = "N.2"
anchors = [
    "[2023:N.2:C001:p1337-1339]",
    "[2023:N.2:C004:p1342-1344]",
    "[2023:N.1:TN.1.R05:p1337]",
]
summary = "With degree_of_freedom greater than 0, $dist_chi_square starts with a squared standard-normal variate for odd degree or zero for even degree, adds twice a unit-mean exponential variate for each even step through the degree, advances the seed through those helper calls, and rounds the result to nearest integer with ties away from zero."
related_clauses = [
    "20.14.2",
]
tags = []

