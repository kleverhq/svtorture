standard_revision = "1800-2023"
part = "22"
clause = "22.14"
anchors = [
    "[2023:22.14:G001:p721]",
]
summary = "`begin_keywords takes a quoted version specifier from 1800-2023, 1800-2017, 1800-2012, 1800-2009, 1800-2005, 1364-2005, 1364-2001, 1364-2001-noconfig, or 1364-1995, and `end_keywords takes no argument."
related_clauses = []
tags = ["keyword-set", "lexical", "preprocessor"]

[requirements.revision_applicability.1800-2012]
status = "changed-expectation"
clause = "22.14"
note = "The 2012 syntax lists versions only through 1800-2012 and therefore does not accept the later 1800-2017 or 1800-2023 specifiers."

[requirements.revision_applicability.1800-2017]
status = "changed-expectation"
clause = "22.14"
note = "The historical standardized version list ends at 1800-2017 and does not accept the 1800-2023 version specifier."

[requirements.revision_applicability.1800-2023]
status = "applicable"
clause = "22.14"

[[requirements]]
id = "SV-2023-22-KEYWORD-DIRECTIVES-PAIRED"
standard_revision = "1800-2023"
part = "22"
clause = "22.14"
anchors = [
    "[2023:22.14:P001:p721]",
]
summary = "`begin_keywords and `end_keywords are distinct directives that shall be paired in source order, with `begin_keywords first and `end_keywords later, delimiting a source block whose reserved identifier set follows a selected IEEE 1364 or 1800 version."
related_clauses = []
tags = ["keyword-set", "preprocessor", "source-order"]

[requirements.revision_applicability.1800-2012]
status = "changed-expectation"
clause = "22.14"
note = "IEEE 1800-2012 does not require every `begin_keywords to have a later `end_keywords; its selected set can remain active to the end of the compilation unit."

[requirements.revision_applicability.1800-2017]
status = "changed-expectation"
clause = "22.14"
note = "The historical standard allows a `begin_keywords region to continue to the end of the compilation unit, rather than requiring every `begin_keywords to be followed by a matching `end_keywords."

[requirements.revision_applicability.1800-2023]
status = "applicable"
clause = "22.14"

