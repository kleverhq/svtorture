tags = ["conditional-compilation", "lexical", "preprocessor"]

[requirements.revision_applicability.1800-2012]
status = "changed-expectation"
clause = "22.6"
note = "The 2012 rule uses line-group productions and does not state the 2023 block-of-text termination and hidden-directive semantics."

[requirements.revision_applicability.1800-2017]
status = "not-applicable"
note = "The historical conditional-compilation rules use groups of lines and do not define the 2023 block_of_text termination rule or its explicit hiding of directive spellings in comments, strings, and macro definitions."

[requirements.revision_applicability.1800-2023]
status = "applicable"
clause = "22.6"

[[requirements]]
