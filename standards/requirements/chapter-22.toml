[requirements.revision_applicability.1800-2017]
status = "changed-expectation"
clause = "22.6"
note = "The historical rule selects the first successful branch using definedness of bare macro identifiers only; parenthesized conditional expressions are not supported."

[requirements.revision_applicability.1800-2023]
status = "applicable"
clause = "22.6"

