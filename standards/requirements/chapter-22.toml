]
summary = "An `ifdef or `elsif succeeds when its bare macro identifier is currently defined or its parenthesized expression resolves to 1; the first successful branch is processed and all later `elsif and `else branches are ignored, while failed branches are ignored and evaluation proceeds in source order, with `else processed only if none succeeded."
