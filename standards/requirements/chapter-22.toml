part = "22"
clause = "22.6"
anchors = [
    "[2023:22.6:G001:p713]",
    "[2023:22.6:P004:p713]",
]
summary = "A conditional-compilation construct begins with `ifdef or `ifndef and a SystemVerilog macro identifier or parenthesized condition, permits optional source-text blocks, zero or more `elsif blocks, and an optional `else block, and ends with `endif; condition expressions may combine identifiers using `!`, `&&`, `||`, `->`, `<->`, and parentheses."
related_clauses = []
tags = ["conditional-compilation", "grammar", "macro", "preprocessor"]

[requirements.revision_applicability.1800-2012]
status = "changed-expectation"
clause = "22.6"
note = "The 2012 grammar permits only a bare text macro identifier after `ifdef, `ifndef, and `elsif; it has no parenthesized condition-expression grammar or logical operators."

[requirements.revision_applicability.1800-2017]
status = "changed-expectation"
clause = "22.6"
note = "The historical grammar permits only a bare text macro identifier after `ifdef, `ifndef, and `elsif; it does not permit parenthesized macro expressions or the 2023 logical operators."

[requirements.revision_applicability.1800-2023]
status = "applicable"
clause = "22.6"

